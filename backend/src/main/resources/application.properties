# ============================================================
#  sentix-quant-mesh  |  Application Configuration
#  Target DB : valuation_engine_db @ localhost:3306
# ============================================================

# --- DataSource ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/valuation_engine_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=[PASSWORD]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Connection Pool (HikariCP defaults tuned for local dev) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- Logging ---
logging.level.com.sentix.quant=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO

# --- External APIs ---
fmp.api.key="your api key"